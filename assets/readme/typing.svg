<svg xmlns="http://www.w3.org/2000/svg" width="880" height="54" viewBox="0 0 880 54" role="img" aria-label="typed taglines">
  <defs>
    <linearGradient id="typ" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25b895">
        <animate attributeName="stop-color" values="#25b895;#3bd6ff;#8a7bff;#ff6fb5;#25b895" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3bd6ff">
        <animate attributeName="stop-color" values="#3bd6ff;#8a7bff;#ff6fb5;#25b895;#3bd6ff" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="880" height="54" fill="none"/>

  <g font-family="ui-monospace,Consolas,monospace" font-size="21" fill="url(#typ)">
    <!-- line 1 : 0s–3.6s -->
    <text x="2" y="34">$ whoami → forgehaus — award-style studio site
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.30;0.33;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
    <!-- line 2 : 4s–7.6s -->
    <text x="2" y="34">$ open index.html → no build, no dependencies
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.36;0.62;0.65;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
    <!-- line 3 : 8s–11.6s -->
    <text x="2" y="34">$ git push → live on github pages in minutes
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.96;0.99;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
  </g>

  <!-- blinking caret -->
  <rect x="604" y="14" width="11" height="25" fill="#25b895">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
</svg>
